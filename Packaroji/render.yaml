services:
  - type: web
    name: packaroji
    runtime: python
    buildCommand: pip install -r remaining/requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT app:app
    # Email verification uses Gmail SMTP. Keep the password as a Render secret.
    # Required secret: PACKAROJI_SMTP_PASSWORD = Gmail App Password for packaroji@gmail.com
