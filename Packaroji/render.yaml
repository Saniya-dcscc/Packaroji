services:
  - type: web
    name: packaroji-b2b-quote-website
    runtime: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: gunicorn --chdir backend --workers 2 --threads 4 --timeout 60 run:app
    healthCheckPath: /health/
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: FLASK_ENV
        value: production
      - key: COOKIE_SECURE
        value: "true"
      - key: SECRET_KEY
        generateValue: true
      - key: PUBLIC_BASE_URL
        value: https://packaroji.com
      - key: MAIL_SERVER
        value: smtp.gmail.com
      - key: MAIL_PORT
        value: "587"
      - key: MAIL_USE_TLS
        value: "true"
      - key: MAIL_USE_SSL
        value: "false"
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_DEFAULT_SENDER
        sync: false
      - key: ENQUIRY_RECIPIENT
        value: packaroji@gmail.com
      - key: WHATSAPP_NUMBER
        value: "918374104569"
      - key: PHONE_DISPLAY
        value: "+91 8374104569"
